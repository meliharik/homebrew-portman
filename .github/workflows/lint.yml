name: Lint cask

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: brew style and audit
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Show versions
        run: |
          brew --version
          ruby --version

      - name: Tap from workspace
        run: brew tap meliharik/portman "$GITHUB_WORKSPACE"

      - name: brew style
        run: brew style meliharik/portman

      - name: brew audit
        run: brew audit --cask --strict --tap meliharik/portman
