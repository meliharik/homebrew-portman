name: Lint cask

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: brew style and audit
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          test-bot: false

      - name: Checkout into tap directory
        uses: actions/checkout@v4
        with:
          path: ${{ steps.setup-homebrew.outputs.repository-path }}

      - name: Show versions
        run: |
          brew --version
          ruby --version

      - name: brew test-bot (syntax only)
        working-directory: ${{ steps.setup-homebrew.outputs.repository-path }}
        run: brew test-bot --only-tap-syntax
